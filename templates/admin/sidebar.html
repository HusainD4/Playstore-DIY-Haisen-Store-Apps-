    <!-- Sidebar Navigation -->
    <nav class="sidebar-nav" style="padding: 8px 0;">
        <a class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}" style="padding: 12px 16px; margin: 2px 8px; border-radius: 8px;">

        </a>
        
        <a class="nav-link {% if request.endpoint in ['admin_apps', 'admin_app_add', 'admin_app_edit'] %}active{% endif %}" href="{{ url_for('admin_apps') }}" style="padding: 12px 16px; margin: 2px 8px; border-radius: 8px;">

        </a>
        
        <a class="nav-link {% if request.endpoint in ['admin_categories', 'admin_category_add', 'admin_category_edit'] %}active{% endif %}" href="{{ url_for('admin_categories') }}" style="padding: 12px 16px; margin: 2px 8px; border-radius: 8px;">

        <a class="nav-link {% if request.endpoint == 'admin_users' %}active{% endif %}" href="{{ url_for('admin_users') }}" style="padding: 12px 16px; margin: 2px 8px; border-radius: 8px;">

            <span>Pengguna</span>
        </a>
        
        <a class="nav-link {% if request.endpoint == 'admin_developer_requests' %}active{% endif %}" href="{{ url_for('admin_developer_requests') }}" style="padding: 12px 16px; margin: 2px 8px; border-radius: 8px;">
            <i class="bi bi-person-badge-fill"></i>
            <span>Request Developer</span>
        </a>
        
        <a class="nav-link {% if request.endpoint == 'admin_reviews' %}active{% endif %}" href="{{ url_for('admin_reviews') }}" style="padding: 12px 16px; margin: 2px 8px; border-radius: 8px;">

    <!-- Sidebar Footer -->
    <div class="sidebar-footer" style="padding: 16px; border-top: 1px solid var(--border); background: transparent;">
        <a href="{{ url_for('index') }}" style="padding: 10px 12px; border-radius: 8px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 10px;">

            <span>Kembali ke Website</span>

<!-- Mobile Toggle Button -->
<button class="navbar-toggler" type="button" onclick="toggleAdminSidebar()" style="position: fixed; top: 16px; left: 16px; z-index: 1060; width: 40px; height: 40px; border-radius: 8px; background: var(--bg-white); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <i class="bi bi-list"></i>
</button>

<!-- Overlay for mobile -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleAdminSidebar()" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1040;"></div>



<script>
function toggleAdminSidebar() {
    const sidebar = document.getElementById('adminSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar) {
        sidebar.classList.toggle('show');
    }
    if (overlay) {
        overlay.classList.toggle('show');
    }
}
</script>
